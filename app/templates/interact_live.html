{% extends "base.html" %}
{% set title = "Deal / Live - Ahelpis阿海" %}

{% block content %}
  <div class="panel">
    <div class="panel-title">Deal / Live（现场拍照验证）</div>
    <div class="panel-body">
      <div class="hint">
        只用相机实时画面拍照发布（页面不提供相册入口）。请勿拍到他人正脸/车牌/二维码等敏感信息。
      </div>
      <div class="cameraWrap" style="margin-top:10px;">
        <video id="cam" class="cameraVideo" autoplay muted playsinline></video>
        <canvas id="shot" style="display:none;"></canvas>
      </div>

      <div class="row" style="margin-top:10px;">
        <span class="pill" id="camState">相机：初始化…</span>
        <span class="pill" id="locState">定位：初始化…</span>
        <span class="pill" id="venueState">场所：待识别</span>
      </div>

      <form id="liveForm" class="form" onsubmit="return false;" style="margin-top:10px;">
        <input type="hidden" id="venueId" value="{{ venue.id if venue else '' }}" />
        <div class="row between" style="flex-wrap:wrap; align-items:center; margin-bottom:8px;">
          <div class="segTabs" id="scopeTabs">
            <button class="segTab" type="button" data-scope="now">Now</button>
            <button class="segTab" type="button" data-scope="keep">Keep</button>
          </div>
          <div class="muted small" id="scopeHint"></div>
        </div>
        <label>
          <div class="label">标题</div>
          <input id="title" placeholder="例如：我在这儿，谁一起吃饭？" />
        </label>
        <label>
          <div class="label">补充说明（可选）</div>
          <textarea id="body" rows="3" placeholder="人数/预算/时长/偏好等"></textarea>
        </label>
        <div class="row">
          <button class="btn primary" id="publishBtn" type="button">拍照并发布</button>
        </div>
        <div class="hint" id="errBox" style="display:none;"></div>
      </form>
    </div>
  </div>

  <script>
    const venueIdEl = document.getElementById('venueId');
    let venueId = venueIdEl.value;
    const video = document.getElementById('cam');
    const canvas = document.getElementById('shot');
    const camState = document.getElementById('camState');
    const locState = document.getElementById('locState');
    const venueState = document.getElementById('venueState');
    const errBox = document.getElementById('errBox');
    const publishBtn = document.getElementById('publishBtn');
    const backBtn = document.getElementById('backBtn');
    const scopeHint = document.getElementById('scopeHint');
    const scopeTabs = Array.from(document.querySelectorAll('#scopeTabs .segTab'));

    let stream = null;
    let lastLoc = null;
    let scopeChoice = 'now';

    function setScope(nextScope){
      scopeChoice = (nextScope === 'keep') ? 'keep' : 'now';
      scopeTabs.forEach(b => b.classList.toggle('active', (b.dataset.scope || 'now') === scopeChoice));
      if(scopeHint){
        scopeHint.textContent = (scopeChoice === 'now') ? 'Now：30 mins' : 'Keep：1 hour';
      }
      if(publishBtn){
        publishBtn.textContent = (scopeChoice === 'now') ? '拍照发布（30 mins）' : '拍照发布（1 hour）';
      }
      try{
        const u = new URL(location.href);
        u.searchParams.set('scope', scopeChoice);
        history.replaceState(null, '', u.toString());
      }catch{}
    }

    function showError(msg) {
      errBox.style.display = 'block';
      errBox.textContent = msg;
    }
    function clearError() {
      errBox.style.display = 'none';
      errBox.textContent = '';
    }

    async function startCamera() {
      camState.textContent = '相机：请求权限…';
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false,
        });
        video.srcObject = stream;
        camState.textContent = '相机：已就绪';
      } catch (e) {
        camState.textContent = '相机：失败';
        showError('无法打开相机：请允许浏览器使用相机权限。');
      }
    }

    function getLocationOnce() {
      locState.textContent = '定位：请求权限…';
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          locState.textContent = '定位：不支持';
          reject(new Error('geolocation_not_supported'));
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const c = pos.coords || {};
            lastLoc = {
              lat: c.latitude,
              lng: c.longitude,
              accuracy: c.accuracy,
              ts: Date.now(),
            };
            locState.textContent = `定位：精度≈${Math.round(lastLoc.accuracy || 0)}m`;
            resolve(lastLoc);
          },
          (err) => {
            locState.textContent = '定位：失败';
            reject(err);
          },
          { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
        );
      });
    }

    async function fetchChallenge() {
      const r = await fetch('/api/challenge?kind=invite_photo', { method: 'GET' });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.detail || 'challenge_failed');
      return j;
    }

    async function autoPickVenueIfEmpty() {
      if (venueId) return;
      if (!lastLoc || !lastLoc.lat || !lastLoc.lng) return;
      try {
        const url = `/api/venues/nearest?lat=${encodeURIComponent(lastLoc.lat)}&lng=${encodeURIComponent(lastLoc.lng)}`;
        const r = await fetch(url, { method: 'GET' });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) return;
        if (j.venue && j.venue.id) {
          venueId = j.venue.id;
          venueIdEl.value = venueId;
          venueState.textContent = `场所：${j.venue.name || venueId}`;
          if (backBtn) backBtn.setAttribute('href', `/interact?venue=${encodeURIComponent(venueId)}`);
        }
      } catch {}
    }

    async function captureBlob(stampText) {
      // Ensure video metadata ready
      await new Promise((resolve) => {
        if (video.videoWidth && video.videoHeight) return resolve();
        video.onloadedmetadata = () => resolve();
      });

      const vw = video.videoWidth || 1280;
      const vh = video.videoHeight || 720;
      const targetW = Math.min(960, vw);
      const targetH = Math.round((targetW / vw) * vh);
      canvas.width = targetW;
      canvas.height = targetH;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, targetW, targetH);

      // Watermark (challenge stamp)
      const pad = 10;
      ctx.font = 'bold 18px system-ui, -apple-system, Segoe UI, Roboto, Arial';
      const text = stampText || 'ABANG';
      const metrics = ctx.measureText(text);
      const boxW = Math.ceil(metrics.width) + pad * 2;
      const boxH = 34;
      const x0 = targetW - boxW - 10;
      const y0 = targetH - boxH - 10;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(x0, y0, boxW, boxH);
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.fillText(text, x0 + pad, y0 + 23);

      return await new Promise((resolve, reject) => {
        canvas.toBlob(
          (blob) => {
            if (!blob) return reject(new Error('blob_failed'));
            resolve(blob);
          },
          'image/jpeg',
          0.92
        );
      });
    }

    async function publish() {
      clearError();
      publishBtn.disabled = true;
      publishBtn.textContent = '处理中…';
      try {
        if (!stream) throw new Error('camera_not_ready');
        const loc = lastLoc || (await getLocationOnce());
        await autoPickVenueIfEmpty();
        if (!venueId) throw new Error('venue_missing');
        if (!loc || !loc.lat || !loc.lng) throw new Error('loc_missing');
        if (!loc.accuracy || loc.accuracy > 1000) throw new Error('loc_accuracy_bad');

        const ch = await fetchChallenge();
        const stamp = ch.stamp || `ABANG ${String(ch.nonce || '').slice(0,6).toUpperCase()}`;
        const blob = await captureBlob(stamp);

        const title = (document.getElementById('title').value || '').trim();
        const body = (document.getElementById('body').value || '').trim();

        const fd = new FormData();
        fd.append('venueId', venueId);
        fd.append('title', title);
        fd.append('body', body);
        fd.append('scope', scopeChoice);
        fd.append('nonce', ch.nonce);
        fd.append('lat', String(loc.lat));
        fd.append('lng', String(loc.lng));
        fd.append('accuracy', String(loc.accuracy || 0));
        fd.append('photo', blob, 'live.jpg');

        const r = await fetch('/api/invite/live', { method: 'POST', body: fd });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.detail || 'publish_failed');

        location.href = `/interact?venue=${encodeURIComponent(venueId)}`;
      } catch (e) {
        const msg = (e && e.message) ? e.message : String(e);
        if (msg === 'camera_not_ready') showError('相机未就绪：请允许相机权限后重试。');
        else if (msg === 'loc_missing') showError('定位未就绪：请允许定位权限后重试。');
        else if (msg === 'loc_accuracy_bad') showError('定位精度过低：请到窗边或开启更高精度后重试。');
        else if (msg === 'venue_missing') showError('未识别到场所：请先在左侧切换一个场所，或稍后重试定位。');
        else showError(`发布失败：${msg}`);
      } finally {
        publishBtn.disabled = false;
        publishBtn.textContent = (scopeChoice === 'now') ? '拍照发布（30 mins）' : '拍照发布（1 hour）';
      }
    }

    publishBtn.addEventListener('click', publish);
    window.addEventListener('load', async () => {
      try{
        const s = (new URL(location.href)).searchParams.get('scope') || 'now';
        setScope(s);
      }catch{
        setScope('now');
      }
      scopeTabs.forEach(b => b.addEventListener('click', () => setScope(b.dataset.scope || 'now')));
      await startCamera();
      try { await getLocationOnce(); await autoPickVenueIfEmpty(); } catch {}
    });
  </script>
{% endblock %}
