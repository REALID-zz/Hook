{% extends "base.html" %}
{% set title = "Map - Ahelpis阿海" %}

{% block content %}
  <div class="panel">
    <div class="panel-title">Map</div>
    <div class="panel-body">
      <div class="hint">只取一次定位展示“我在哪 + 场所点位”，不做持续追踪。</div>
      <div class="row" style="margin-top:10px;">
        <div class="pill">location：{{ venue.name if venue else "未选择" }}</div>
        <a class="btn" href="/universe?venue={{ venue.id if venue else '' }}">返回 Universe</a>
        <a class="btn primary" href="/invite/new?venue={{ venue.id if venue else '' }}">询问next</a>
        <a class="btn" href="/help?venue={{ venue.id if venue else '' }}#helpis">去 Helpis</a>
      </div>
      <div id="map" class="mapbox rippleFeel" data-ripple="hover click"></div>
      <div class="muted small" id="mapState" style="margin-top:10px;"></div>
    </div>
  </div>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const venueId = {{ (venue.id if venue else '')|tojson }};
    const stateEl = document.getElementById('mapState');

    function setState(t){ stateEl.textContent = t || ''; }

    const map = L.map('map', { zoomControl: true, attributionControl: true });
    // default view: HK-ish; will re-center after geolocation.
    map.setView([22.3193, 114.1694], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const markers = L.layerGroup().addTo(map);

    function addVenueMarker(v){
      if(!v || !v.lat || !v.lng) return;
      const m = L.circleMarker([v.lat, v.lng], {
        radius: (v.id === venueId) ? 8 : 6,
        weight: 2,
        color: (v.id === venueId) ? '#111' : '#555',
        fillColor: (v.id === venueId) ? '#111' : '#999',
        fillOpacity: 0.85,
      });
      const label = `${v.name || v.id}${v.city ? ' · ' + v.city : ''}`;
      m.bindPopup(`${label}<div class="muted small" style="margin-top:6px;">点击切换到该场所</div>`);
      m.on('click', () => {
        location.href = `/help?venue=${encodeURIComponent(v.id)}#helpis`;
      });
      m.addTo(markers);
    }

    async function loadVenues(){
      setState('加载场所点位…');
      const r = await fetch('/api/venues/geo');
      const j = await r.json().catch(()=>[]);
      if(!r.ok) throw new Error('venues_geo_failed');
      markers.clearLayers();
      (j || []).forEach(addVenueMarker);
      setState('已加载场所点位。');
    }

    async function locateOnce(){
      if(!navigator.geolocation){
        setState('浏览器不支持定位。');
        return;
      }
      setState('请求定位权限…');
      try{
        const pos = await new Promise((resolve,reject)=>{
          navigator.geolocation.getCurrentPosition(resolve,reject,{ enableHighAccuracy:true, timeout:8000, maximumAge:0 });
        });
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const acc = Math.round(pos.coords.accuracy || 0);
        const me = L.circleMarker([lat,lng], { radius: 7, weight: 2, color:'#0f172a', fillColor:'#0f172a', fillOpacity:0.55 });
        me.bindPopup(`我在这里（±${acc}m）`);
        me.addTo(markers);
        map.setView([lat,lng], 15);
        setState(`定位成功（±${acc}m）。`);
      }catch(e){
        setState('定位失败：请允许定位权限。');
      }
    }

    (async ()=>{
      try{
        await loadVenues();
        await locateOnce();
      }catch(e){
        setState(`地图初始化失败：${e.message || e}`);
      }
    })();
  </script>
{% endblock %}
